name: CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-dockerize:
    runs-on: ubuntu-latest

    steps:
      # 1. 코드 체크아웃
      - name: Checkout code
        uses: actions/checkout@v3

      # 2. Java 21 환경 설정
      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '21'

      # 3. Maven 빌드
      - name: Build with Maven
        run: mvn clean package -DskipTests

      # 4. Docker 이미지 빌드 및 푸시
      - name: Build and push Docker image
        run: |
          docker build \
            --build-arg JAR_FILE=target/your-app-0.0.1-SNAPSHOT.jar \
            -t your-dockerhub-username/ktb_discordchatbot:latest .
          docker push your-dockerhub-username/ktb_discordchatbot:latest

      # 5. Docker Hub 로그인
      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
